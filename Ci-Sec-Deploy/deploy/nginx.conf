# Ci-Sec reverse proxy — HTTPS only, port 11445, local 5y certificate.
# This server block is isolated and only owns port 11445, so other systems
# can run their own nginx/containers on the same Docker host without conflict.

server {
    listen 11445 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cisec.crt;
    ssl_certificate_key /etc/nginx/certs/cisec.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 100m;

    # API
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Frontend (static React served by web container)
    location / {
        proxy_pass http://web:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
